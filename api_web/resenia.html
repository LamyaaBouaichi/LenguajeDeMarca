<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Málaga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Málaga</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="galeria.html">Galería</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="resenia.html">Reseñas</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Reseñas de los Visitantes</h2>
        <h3 class="text-center mt-5">Escriba un comentario</h3>
        <form action="" method="post">
            <div class="form-group">
                <label for="nombre">Tu Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="calificacion">Calificación:</label>
                <select class="form-control" id="calificacion" name="calificacion" required>
                    <option value="1">&#9733; 1 estrella</option>
                    <option value="2">&#9733;&#9733; 2 estrellas</option>
                    <option value="3">&#9733;&#9733;&#9733; 3 estrellas</option>
                    <option value="4">&#9733;&#9733;&#9733;&#9733; 4 estrellas</option>
                    <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; 5 estrellas</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comentario">Tu Comentario:</label>
                <textarea class="form-control" id="comentario" name="comentario" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Enviar Reseña</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
